<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>pre{white-space:pre-wrap}iframe{box-sizing:border-box}</style><title>Isolated hand-assignment identity</title>
<h1>Hand-assignment identity: isolated app</h1><p>Uses memory-only preferences, blocks score storage and MIDI, and forces XML extraction failure only inside this test frame. Original MXL rendering remains enabled.</p>
<button id="run">Load isolated app</button><button id="checks" disabled>Run isolated app checks</button><pre id="results"></pre><iframe id="app" style="width:100%;height:800px;border:1px solid" allow="autoplay"></iframe>
<script>
document.getElementById('run').onclick=async function(){
 this.disabled=true;
 let html=await(await fetch('../../index.html')).text();
 const root=new URL('../../',location.href).href;
 const block=`<base href="${root}"><script>
 window.testErrors=[];addEventListener('error',e=>testErrors.push(e.message));addEventListener('unhandledrejection',e=>testErrors.push(String(e.reason)));
 window.assignmentTestData={};
 const memoryStore=data=>new Proxy(data,{get(target,key){if(key==='getItem')return k=>target[k]??null;if(key==='setItem')return(k,v)=>{target[k]=String(v);};if(key==='removeItem')return k=>{delete target[k];};return target[key];}});
 Object.defineProperty(window,'localStorage',{value:memoryStore(assignmentTestData)});
 Object.defineProperty(window,'sessionStorage',{value:memoryStore({})});
 Object.defineProperty(window,'indexedDB',{get(){throw Error('Score storage blocked in identity test');}});
 Object.defineProperty(navigator,'requestMIDIAccess',{value:()=>Promise.reject(Error('Hardware disabled for storage test'))});
 <\/script>`;
 html=html.replace('<head>','<head>'+block).replace(/<script[^>]+src="https:[\s\S]*?<\/script>/g,'');
 const frame=document.getElementById('app');
 frame.onload=()=>{
 document.getElementById('checks').disabled=false;
 const doc=frame.contentDocument;const report=document.getElementById('results');
 report.textContent='App loaded with isolated preferences; native settings/scores untouched.';
 const check=doc.createElement('script');check.textContent=`setTimeout(()=>{parent.document.getElementById('results').textContent+='\\nStartup errors: '+JSON.stringify(testErrors);},1500);`;doc.body.appendChild(check);
 };
 frame.srcdoc=html;
};

document.getElementById('checks').onclick=function(){
 this.disabled=true;
 const frame=document.getElementById('app'), script=frame.contentDocument.createElement('script');
 script.textContent='('+async function(){
 const output=parent.document.getElementById('results');let count=0;
 const check=(ok,label)=>{if(!ok)throw Error(label);output.textContent+='\nPASS: '+label;count++;};
 try {
 document.getElementById('btn-help-close').click();
 const demos=await ScoreLibrary.getDemoScores();
 const a=demos.find(s=>s.title==='Hot Cross Buns'), b=demos.find(s=>s.title==='Mary Had a Little Lamb');
 const open=async(score,name=score.fileName)=>loadScoreIntoApp(score.rawData,{fileName:name,fileType:score.fileType,title:score.title});
 const paths=()=>Array.from(document.querySelectorAll('#osmdSvgPage1 path')).map(p=>p.getAttribute('d')).join('|');
 await open(a);const normalPaths=paths();
 HandAssignment.setCompact(1,2);
 const normalKey=Object.keys(assignmentTestData).find(k=>k.startsWith('pt_handAssignment_v1_'));
 await open(a);check(HandAssignment.roleForStaff(1)==='left','Canonical assignments survive reopening');
 const canonical=getCanonicalMusicXmlForTranspose;
 getCanonicalMusicXmlForTranspose=async()=>null;
 const originalLoad=osmd.load.bind(osmd);let lastBytes;
 osmd.load=async payload=>{if(payload instanceof Blob) lastBytes=new Uint8Array(await payload.arrayBuffer());return originalLoad(payload);};
 await open(a,'same-name.mxl');
 check(HandAssignment.roleForStaff(1)==='right','Fallback does not guess canonical assignments');
 check(normalPaths.length>0 && paths()===normalPaths,'Forced extraction failure preserves original MXL SVG paths');
 check(document.getElementById('assignment-mode').querySelector('[value="voice"]').disabled && document.getElementById('assignment-storage').textContent.includes('exact source file'),'Missing XML explains staff-only fallback');
 check(lastBytes.length===a.rawData.byteLength && lastBytes.every((v,i)=>v===new Uint8Array(a.rawData)[i]),'OSMD receives original MXL bytes');
 HandAssignment.setCompact(1,2);
 const fallbackKey=Object.keys(assignmentTestData).find(k=>k.startsWith('pt_handAssignment_v1_') && k!==normalKey);
 check(!!fallbackKey,'Raw-source assignments persist under a distinct identity');
 await open(b,'same-name.mxl');check(HandAssignment.roleForStaff(1)==='right','Different score with same filename does not inherit assignments');
 await open(a,'renamed.mxl');check(HandAssignment.roleForStaff(1)==='left','Same source renamed/reopened restores fallback assignments');
 const backup=buildSettingsBackupPayload();check(!!backup.settings[fallbackKey],'Settings backup includes fallback identity');
 importSettingsBackupPayload(backup);await open(a);check(HandAssignment.roleForStaff(1)==='left','Backup restore retains fallback assignments');
 const before=JSON.stringify(assignmentTestData);
 await HandAssignment.initialize(null);HandAssignment.setCompact(1,2);
 check(JSON.stringify(assignmentTestData)===before,'No usable identity means no preference write');
 await HandAssignment.initialize(null);check(HandAssignment.roleForStaff(1)==='right','Identity-less loads do not share transient assignments');
 getCanonicalMusicXmlForTranspose=canonical;osmd.load=originalLoad;
 await open(a);check(HandAssignment.roleForStaff(1)==='left','Canonical identity remains intact after recovery');
 check(testErrors.length===0,'No uncaught app errors');
 getCanonicalMusicXmlForTranspose=async()=>null;await open(a);getCanonicalMusicXmlForTranspose=canonical;
 document.getElementById('btn-practice').click();
 output.textContent+='\nCompleted '+count+' checks. Native settings and scores were never accessed.';
 }catch(error){output.textContent+='\nFAIL: '+error.stack;}
 } .toString()+')()';
 frame.contentDocument.body.appendChild(script);
};
</script>
